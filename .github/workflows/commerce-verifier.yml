name: Commerce verifier

on:
  pull_request:
    paths:
      - "packages/crypto/**"
      - "packages/pay/src/verifier/**"
      - "packages/pay/src/index.ts"
      - "packages/pay/package.json"
      - "pnpm-lock.yaml"
      - ".github/workflows/commerce-verifier.yml"
  push:
    branches: [main]
    paths:
      - "packages/crypto/**"
      - "packages/pay/src/verifier/**"
      - "packages/pay/src/index.ts"
      - "packages/pay/package.json"
      - "pnpm-lock.yaml"

permissions:
  contents: read

jobs:
  offline-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Activate the pinned pnpm toolchain
        run: npm install --global corepack@0.34.1 && corepack enable
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build Pay dependency graph
        run: pnpm turbo run build --filter='@0xkey-io/pay^...'
      - name: Build crypto verifier dependency
        working-directory: packages/crypto
        run: |
          pnpm typecheck
          node ../../node_modules/jest/bin/jest.js --runInBand --forceExit src/__tests__/commerce-verifier.test.ts
          pnpm build
      - name: Typecheck and test public verifier
        working-directory: packages/pay
        run: |
          pnpm typecheck
          pnpm exec jest --runInBand src/verifier/verifier.test.ts src/verifier/conformance.test.ts
      - name: Build and verify vendored artifacts
        working-directory: packages/pay
        run: |
          pnpm build
      - name: Smoke packed crypto exports and Pay isolation
        run: |
          mkdir -p /tmp/ox003-pack/pay /tmp/ox003-pack/crypto
          (cd packages/pay && npm pack --ignore-scripts --pack-destination /tmp/ox003-pack)
          (cd packages/crypto && npm pack --ignore-scripts --pack-destination /tmp/ox003-pack)
          tar -xzf /tmp/ox003-pack/0xkey-io-pay-*.tgz -C /tmp/ox003-pack/pay
          tar -xzf /tmp/ox003-pack/0xkey-io-crypto-*.tgz -C /tmp/ox003-pack/crypto
          ln -s "${{ github.workspace }}/packages/pay/node_modules" /tmp/ox003-pack/pay/package/node_modules
          ln -s "${{ github.workspace }}/packages/crypto/node_modules" /tmp/ox003-pack/crypto/package/node_modules
          node -e 'const p=require("/tmp/ox003-pack/pay/package");const n=["verifyDetachedJwsLive","verifyEip3009Live","verifyBootBinding","verifyCommerceVerifierBundle"];if(n.some(x=>Object.hasOwn(p,x)))process.exit(1)'
          node --input-type=module -e 'const p=await import("file:///tmp/ox003-pack/pay/package/dist/index.mjs");const n=["verifyDetachedJwsLive","verifyEip3009Live","verifyBootBinding","verifyCommerceVerifierBundle"];if(n.some(x=>Object.hasOwn(p,x)))process.exit(1)'
          test ! -e /tmp/ox003-pack/pay/package/dist/verifier
          test ! -e /tmp/ox003-pack/pay/package/dist/commerce-verifier
          node -e 'const p=require("/tmp/ox003-pack/crypto/package");if(typeof p.verifyCommerceSignature!=="function"||typeof p.CommerceBootVerificationError!=="function"||Object.hasOwn(p,"projectAuthenticatedCommerceAppProof"))process.exit(1)'
          node --input-type=module -e 'const p=await import("file:///tmp/ox003-pack/crypto/package/dist/index.mjs");if(typeof p.verifyCommerceSignature!=="function"||typeof p.CommerceBootVerificationError!=="function"||Object.hasOwn(p,"projectAuthenticatedCommerceAppProof"))process.exit(1)'
          printf '%s\n' 'import { CommerceBootVerificationError, verifyCommerceSignature } from "/tmp/ox003-pack/crypto/package";' 'void [CommerceBootVerificationError, verifyCommerceSignature];' > /tmp/ox003-pack/public-api-smoke.ts
          node node_modules/typescript/bin/tsc --noEmit --strict --skipLibCheck --moduleResolution node --module commonjs /tmp/ox003-pack/public-api-smoke.ts
          ! grep -q "projectAuthenticatedCommerceAppProof" /tmp/ox003-pack/crypto/package/dist/index.d.ts
      - name: Public runtime has no network adapter
        run: |
          ! grep -Eq "fetch\(|XMLHttpRequest|WebSocket|node:(http|https|net|tls|dns)" packages/pay/src/verifier/index.ts packages/crypto/src/commerce-verifier.ts
