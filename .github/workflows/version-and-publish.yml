name: Version Packages Create Release Branch and Publish

# Security patch branch variant of the release workflow. Dispatch it with
# `--ref <this security/* branch>`. Unlike the default-branch workflow, every
# job builds this branch's own commit (never the default branch), only the
# packages listed in .github/security-patch.json are packed, verified and
# published, and nothing is merged back into the default branch.

on:
  workflow_dispatch:
    inputs:
      enable_release:
        description: "Run the protected release workflow"
        required: true
        type: boolean
        default: false
      publish_to_npm:
        description: "Publish the packed security patch packages to npm"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: security-patch-release
  cancel-in-progress: false

jobs:
  version-and-pack:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_release && startsWith(github.ref, 'refs/heads/security/') }}
    outputs:
      release_sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # required for changeset commit lookups
          ref: ${{ github.sha }}

      - name: Setup JS
        uses: ./.github/actions/js-setup

      - name: Configure Git User
        run: |
          git config user.name "0xkey-deploy"
          git config user.email "github@0xkey.io"

      - name: Version packages
        run: |
          pnpm changeset version
          pnpm run version
          pnpm install -r --frozen-lockfile
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, typecheck and test
        run: |
          pnpm run build-all
          pnpm run typecheck-all
          pnpm run prettier-all:check
          for pkg in $(node -p "require('./.github/security-patch.json').test.join(' ')"); do
            pnpm --filter "$pkg" test
          done

      - name: Pack and verify the release
        run: node scripts/security-patch-release.mjs pack packed

      - name: Commit and push the release commit
        id: commit
        run: |
          git add -A -- . ':!packed'
          git commit -m "chore: release packages (security patch)"
          git push origin "HEAD:refs/heads/release/${{ github.ref_name }}/${{ github.run_id }}"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Upload packed release
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: security-patch-release
          path: packed/
          if-no-files-found: error

  publish:
    needs: version-and-pack
    if: ${{ inputs.publish_to_npm }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout release commit
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: ${{ needs.version-and-pack.outputs.release_sha }}

      - name: Setup Node
        uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version-file: ".nvmrc"

      - name: Download packed release
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: security-patch-release
          path: packed

      - name: Publish to npm
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          node scripts/security-patch-release.mjs publish packed --dry-run
          node scripts/security-patch-release.mjs publish packed
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Tag the published release commit
        run: |
          git config user.name "0xkey-deploy"
          git config user.email "github@0xkey.io"
          for spec in $(node -p "require('./.github/security-patch.json').publish.map((p) => p.name + '@' + p.version).join(' ')"); do
            git tag "$spec" "${{ needs.version-and-pack.outputs.release_sha }}"
            git push origin "refs/tags/$spec"
          done
