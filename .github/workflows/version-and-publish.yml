name: Version Packages Create Release Branch and Publish

on:
  workflow_dispatch:
    inputs:
      enable_release:
        description: "Run the protected release workflow"
        required: true
        type: boolean
        default: false
      publish_to_npm:
        description: "Publish packages to npm after versioning and integration tests"
        required: true
        type: boolean
        default: false
      # The preprod/prod integration suites need API secrets that are not
      # configured. Releases skip them by default and rely on unit tests plus
      # a prod smoke test after publishing; see RELEASING.md.
      run_integration_tests:
        description: "Run preprod/prod integration tests (requires API secrets)"
        required: false
        type: boolean
        default: false
      # Leave empty for a normal release. Set to one package name, for example
      # @0xkey-io/attested-stamper, to publish only that package's current
      # version after a partial publish; see RELEASING.md.
      republish_package:
        description: "Publish only this package's current version (partial-publish recovery)"
        required: false
        type: string
        default: ""
  push:
    tags:
      - "v*.*.*" # Tag pushes are intentionally guarded; they do not publish automatically.

permissions:
  contents: write
  packages: write
  id-token: write
  pull-requests: write

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_release && inputs.republish_package == '' }}
    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # required for git tags and history
          ref: ${{ github.event.repository.default_branch }}

      # Install and cache JS toolchain and dependencies (node_modules)
      - name: Setup JS
        uses: ./.github/actions/js-setup

      - name: Enforce dedicated Pay release path
        run: node packages/pay/scripts/check-generic-release-exclusion.mjs

      # npm checks repository.url against the provenance statement only when
      # each package is uploaded, so a mismatch leaves a partial release.
      - name: Require repository metadata for provenance
        run: node scripts/release-guard.mjs assert-repository

      # Check if there are pending changesets
      - name: Check for pending releases
        run: |
          echo "Checking for pending changesets..."
          git fetch origin main
          CHANGES_STATUS=$(pnpm changeset status --verbose)
          echo "$CHANGES_STATUS"
          if echo "$CHANGES_STATUS" | grep -qi "packages to be bumped"; then
            echo "Changesets found, continuing"
          else
            echo "No unreleased changesets found, exiting"
            exit 1
          fi

      # changeset publish silently skips a name@version that already exists on
      # npm (for example one published from a security release line). Fail
      # before versioning instead; see RELEASING.md "Security release lines".
      - name: Refuse planned versions that already exist on npm
        run: |
          pnpm changeset status --output=changeset-status.json
          node scripts/release-guard.mjs assert-unpublished --changeset-status changeset-status.json
          rm changeset-status.json

      - name: Debug Foundry
        run: anvil --version || echo "anvil not found"

      - name: Build
        run: pnpm run build-all

      - name: Typecheck
        run: pnpm run typecheck-all

      - name: Prettier
        run: node .github/scripts/check-prettier-debt.mjs

  version-and-rebuild:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # required for git tags and history
          ref: ${{ github.event.repository.default_branch }}

      - name: Setup JS
        uses: ./.github/actions/js-setup

      - name: Configure Git User
        run: |
          git config user.name "0xkey-deploy"
          git config user.email "github@0xkey.io"

      # release/* is a use-once-and-discard scratch branch, never a long-lived
      # branch. It must always be cut fresh from the commit we just checked
      # out above (the default branch tip), never reused from a stale remote
      # copy left over by a previous run - otherwise a leftover
      # origin/release/<ref> branch would silently resurrect old, already
      # superseded version bumps/changesets instead of the current main.
      - name: Create fresh release branch from the latest default branch
        run: |
          git fetch origin
          git push origin --delete release/${{ github.ref_name }} || \
            echo "No stale origin/release/${{ github.ref_name }} to delete"
          git checkout -B release/${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Process changesets, update versions, and rebuild packages to include latest versions
      - name: Version and rebuild packages
        run: |
          node packages/pay/scripts/check-generic-release-exclusion.mjs
          pnpm changeset version
          pnpm run version
          pnpm install -r
          pnpm run build-all
          pnpm run typecheck-all
          node .github/scripts/check-prettier-debt.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Pack every generic package as pnpm publishes it and check versions,
      # resolved internal dependency ranges and key exported symbols.
      - name: Pack smoke versioned packages
        run: node scripts/release-guard.mjs pack-smoke

      - name: Debug Git Status
        run: |
          echo "Git status before commit:"
          git status --short
          echo "Listing .changeset directory:"
          ls -la .changeset || echo ".changeset directory not found"

      - name: Commit versioned changes
        run: |
          git add -A
          git commit -m "chore: release packages" || echo "No changes to commit"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push changes to release branch
        run: |
          # -f is safe/expected here: release/${{ github.ref_name }} is the
          # disposable scratch branch we just deleted and recreated above, so
          # this is never rewriting history anyone else has based work on.
          git push -f -u origin release/${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  test-pre-prod:
    runs-on: ubuntu-latest
    needs: version-and-rebuild
    if: ${{ inputs.run_integration_tests }}
    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # required for git tags and history
          ref: release/${{ github.ref_name }}

      # Install and cache JS toolchain and dependencies (node_modules)
      - name: Setup JS
        uses: ./.github/actions/js-setup

      - name: Install latest dependencies
        run: pnpm install -r --frozen-lockfile

      - name: Build all packages
        run: pnpm run build-all

      - name: Test (preprod)
        run: anvil & pnpm run test-all && lsof -t -i tcp:8545 | xargs kill
        env:
          API_PUBLIC_KEY: ${{ secrets.PREPROD_API_PUBLIC_KEY }}
          API_PRIVATE_KEY: ${{ secrets.PREPROD_API_PRIVATE_KEY }}
          BASE_URL: ${{ secrets.PREPROD_BASE_URL }}
          ORGANIZATION_ID: ${{ secrets.PREPROD_ORGANIZATION_ID }}
          PRIVATE_KEY_ID: ${{ secrets.PREPROD_PRIVATE_KEY_ID }}
          EXPECTED_PRIVATE_KEY_ETH_ADDRESS: ${{ secrets.PREPROD_EXPECTED_PRIVATE_KEY_ETH_ADDRESS }}
          EXPECTED_PRIVATE_KEY_ETH_ADDRESS_2: ${{ secrets.PREPROD_EXPECTED_PRIVATE_KEY_ETH_ADDRESS_2 }}
          EXPECTED_WALLET_ACCOUNT_ETH_ADDRESS: ${{ secrets.PREPROD_EXPECTED_WALLET_ACCOUNT_ETH_ADDRESS }}
          EXPECTED_WALLET_ACCOUNT_ETH_ADDRESS_2: ${{ secrets.PREPROD_EXPECTED_WALLET_ACCOUNT_ETH_ADDRESS_2 }}
          BANNED_TO_ADDRESS: ${{ secrets.PREPROD_BANNED_TO_ADDRESS }}
          SOLANA_TEST_ORG_API_PRIVATE_KEY: ${{ secrets.SOLANA_TEST_ORG_API_PRIVATE_KEY }}
          WALLET_ID: ${{ secrets.PREPROD_WALLET_ID }}

  test-prod:
    runs-on: ubuntu-latest
    needs: test-pre-prod
    if: ${{ inputs.run_integration_tests }}
    steps:
      # https://github.com/actions/checkout
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # required for git tags and history
          ref: release/${{ github.ref_name }}

      # Install and cache JS toolchain and dependencies (node_modules)
      - name: Setup JS
        uses: ./.github/actions/js-setup

      - name: Install latest dependencies
        run: pnpm install -r --frozen-lockfile

      - name: Build all packages
        run: pnpm run build-all

      - name: Test (prod)
        run: anvil & pnpm run test-all && lsof -t -i tcp:8545 | xargs kill
        env:
          API_PUBLIC_KEY: ${{ secrets.API_PUBLIC_KEY }}
          API_PRIVATE_KEY: ${{ secrets.API_PRIVATE_KEY }}
          BASE_URL: "https://api.0xkey.io"
          ORGANIZATION_ID: ${{ secrets.ORGANIZATION_ID }}
          PRIVATE_KEY_ID: ${{ secrets.PRIVATE_KEY_ID }}
          EXPECTED_PRIVATE_KEY_ETH_ADDRESS: ${{ secrets.EXPECTED_PRIVATE_KEY_ETH_ADDRESS }}
          EXPECTED_PRIVATE_KEY_ETH_ADDRESS_2: ${{ secrets.EXPECTED_PRIVATE_KEY_ETH_ADDRESS_2 }}
          EXPECTED_WALLET_ACCOUNT_ETH_ADDRESS: ${{ secrets.EXPECTED_WALLET_ACCOUNT_ETH_ADDRESS }}
          EXPECTED_WALLET_ACCOUNT_ETH_ADDRESS_2: ${{ secrets.EXPECTED_WALLET_ACCOUNT_ETH_ADDRESS_2 }}
          BANNED_TO_ADDRESS: "0x6F72eDB2429820c2A0606a9FC3cA364f5E9b2375"
          SOLANA_TEST_ORG_API_PRIVATE_KEY: ${{ secrets.SOLANA_TEST_ORG_API_PRIVATE_KEY }}
          WALLET_ID: ${{ secrets.WALLET_ID }}

  publish:
    needs: [version-and-rebuild, test-pre-prod, test-prod]
    if: >-
      ${{ always()
      && needs.version-and-rebuild.result == 'success'
      && (needs.test-pre-prod.result == 'success' || needs.test-pre-prod.result == 'skipped')
      && (needs.test-prod.result == 'success' || needs.test-prod.result == 'skipped')
      && github.event_name == 'workflow_dispatch' && inputs.enable_release && inputs.publish_to_npm }}
    runs-on: ubuntu-latest
    environment: production # require manual approval for production deployments
    permissions:
      contents: write # push the release tags
      id-token: write # npm provenance
    outputs:
      release_tags: ${{ steps.tags.outputs.release_tags }}

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # required for git tags and history
          ref: release/${{ github.ref_name }}

      - name: Configure Git User
        run: |
          git config user.name "0xkey-deploy"
          git config user.email "github@0xkey.io"

      - name: Setup Node, pnpm, and deps
        uses: ./.github/actions/js-setup

      - name: Install latest dependencies
        run: pnpm install -r --frozen-lockfile

      - name: Enforce dedicated Pay release path
        run: node packages/pay/scripts/check-generic-release-exclusion.mjs

      # Rebuild from the versioned release branch instead of relying on a
      # cross-job artifact upload (which is slow/flaky for many small files).
      # build-all runs in topological order so every package has fresh dist.
      - name: Build all packages
        run: pnpm run build-all

      # Final pre-publish gates on the exact tree that will be published.
      # Every package this release branch versioned must still be absent from
      # npm, so changeset publish can never skip one silently.
      - name: Refuse versions that already exist on npm
        run: |
          git fetch origin ${{ github.event.repository.default_branch }}
          node scripts/release-guard.mjs assert-unpublished --since-ref origin/${{ github.event.repository.default_branch }}

      - name: Pack smoke
        run: node scripts/release-guard.mjs pack-smoke

      - name: Confirm environment variables
        run: |
          if [ -n "${{ secrets.GITHUB_TOKEN }}" ]; then
            echo "GITHUB_TOKEN is set"
          else
            echo "GITHUB_TOKEN is not set"
            exit 1
          fi
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "NPM_TOKEN is set"
          else
            echo "NPM_TOKEN is not set"
            exit 1
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to NPM (dry run)
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          pnpm --filter '!@0xkey-io/pay' publish -r --dry-run --no-git-checks --provenance --report-summary
          echo "npm publish dry run summary:"
          cat publish-summary.json || echo "No NPM dry run summary generated"
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # Publish the files that "Build all packages" built and "Pack smoke"
          # checked. Without this, every package's prepublishOnly (clean and
          # build) runs again; see the same variable on the publish step below.
          NPM_CONFIG_IGNORE_SCRIPTS: "true"

      - name: Publish packages to NPM
        id: publish
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          echo "Publishing packages to NPM..."
          # Pay is permanently private in source. The wrapper verifies the
          # official Changesets ignore/candidate boundary without mutating it.
          # Pay is released exclusively from the checked tarball in pay-publish.yml.
          node packages/pay/scripts/publish-generic-release.mjs || {
            echo "❌ Publish failed. Check logs above.";
            exit 1;
          }
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          # changeset publish has no --provenance flag; pnpm passes npm config
          # from the environment to the npm publish it runs.
          NPM_CONFIG_PROVENANCE: "true"
          # changeset publish publishes up to 10 packages at the same time, and
          # each one's prepublishOnly runs `clean` and `build`. One package's
          # `clean` removes the dist/ that another package is type-checking
          # against, and the other package can be published without its .d.ts
          # files (this happened to react-native-passkey-stamper 0.1.4). Skip
          # the lifecycle scripts so that what is published is exactly what
          # "Build all packages" built and "Pack smoke" checked.
          NPM_CONFIG_IGNORE_SCRIPTS: "true"

      # changeset publish tags each published package on the release commit
      # (@0xkey-io/<pkg>@<version>). Push exactly those tags, also after a
      # partial publish, so the published versions can be registered on main.
      - name: Push release tags
        id: tags
        if: ${{ always() && steps.publish.outcome != 'skipped' }}
        run: |
          tags=$(git tag --points-at HEAD --list '@0xkey-io/*')
          if [ -z "$tags" ]; then
            echo "No release tags were created" >&2
            exit 1
          fi
          for tag in $tags; do
            git push origin "refs/tags/$tag"
          done
          echo "release_tags=$(printf '%s\n' "$tags" | jq -R . | jq -cs .)" >> "$GITHUB_OUTPUT"

      - name: Record release verification
        env:
          RUN_INTEGRATION_TESTS: ${{ inputs.run_integration_tests }}
        run: |
          {
            echo "## Release verification"
            if [ "$RUN_INTEGRATION_TESTS" = "true" ]; then
              echo "Preprod and prod integration tests ran before publishing."
            else
              echo "Integration tests were skipped (run_integration_tests=false)."
              echo "They are replaced by unit tests in CI and a prod smoke test after publishing."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # Bring the "chore: release packages" version-bump commit (produced on the
  # scratch release/* branch by version-and-rebuild) back to the default
  # branch once publish has succeeded, through a PR that a maintainer reviews
  # and merges. The workflow never pushes to the default branch itself.
  sync-main:
    runs-on: ubuntu-latest
    needs: publish
    # always(): publish -> test-pre-prod / test-prod are legitimately skipped
    # when run_integration_tests=false, which would otherwise skip this job.
    if: ${{ always() && needs.publish.result == 'success' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout release branch
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          ref: release/${{ github.ref_name }}

      - name: Open PR with the published version bump
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SYNC_BRANCH="chore/sync-release-${{ github.run_id }}"
          git checkout -B "$SYNC_BRANCH"
          git push -u origin "$SYNC_BRANCH"
          gh pr create \
            --base "${{ github.event.repository.default_branch }}" \
            --head "$SYNC_BRANCH" \
            --title "chore: sync published package versions (run #${{ github.run_id }})" \
            --body "Version-bump commit from \`release/${{ github.ref_name }}\`, already published to npm by run ${{ github.run_id }}. Merge it so package.json versions and \`.changeset/\` match npm. PRs opened with GITHUB_TOKEN do not start CI; close and reopen this PR to run the checks."

  # One GitHub Release per published package tag. The tag never comes from
  # github.ref_name, which is the dispatching branch (main).
  prepare-release:
    runs-on: ubuntu-latest
    needs: publish
    if: ${{ always() && needs.publish.result == 'success' }}
    permissions:
      contents: write
    strategy:
      matrix:
        tag: ${{ fromJSON(needs.publish.outputs.release_tags) }}
    steps:
      - name: Refuse a tag that is not a package release
        env:
          TAG: ${{ matrix.tag }}
        run: |
          case "$TAG" in
            @0xkey-io/*@[0-9]*) ;;
            *) echo "Refusing release tag: $TAG" >&2; exit 1 ;;
          esac

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ matrix.tag }}
          name: ${{ matrix.tag }}
          body: ${{ inputs.run_integration_tests && 'Preprod and prod integration tests ran before publishing.' || 'Integration tests were skipped; they are replaced by unit tests in CI and a prod smoke test after publishing.' }}
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Partial-publish recovery: publish exactly one package's current version
  # from the default branch, after the published versions are registered
  # there. Nothing is versioned, and no other package is published.
  republish:
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.enable_release && inputs.publish_to_npm && inputs.republish_package != '' }}
    environment: production # require manual approval for production deployments
    permissions:
      contents: write # push the release tag
      id-token: write # npm provenance
    env:
      PACKAGE: ${{ inputs.republish_package }}
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0 # required for git tags and history
          ref: ${{ github.event.repository.default_branch }}

      - name: Configure Git User
        run: |
          git config user.name "0xkey-deploy"
          git config user.email "github@0xkey.io"

      - name: Setup Node, pnpm, and deps
        uses: ./.github/actions/js-setup

      - name: Install latest dependencies
        run: pnpm install -r --frozen-lockfile

      - name: Enforce dedicated Pay release path
        run: node packages/pay/scripts/check-generic-release-exclusion.mjs

      - name: Require repository metadata for provenance
        run: node scripts/release-guard.mjs assert-repository

      # The target version must be absent from npm, every other generic
      # package must already be on npm at its workspace version, and each
      # published dependent must pin a range the target version satisfies.
      - name: Check the republish target
        run: node scripts/release-guard.mjs assert-republishable "$PACKAGE"

      - name: Build all packages
        run: pnpm run build-all

      - name: Pack and check the tarball
        id: pack
        run: |
          packed=$(node scripts/release-guard.mjs pack-republish "$PACKAGE" "$RUNNER_TEMP/republish")
          echo "$packed"
          {
            echo "name=$(jq -r .name <<<"$packed")"
            echo "version=$(jq -r .version <<<"$packed")"
            echo "tarball=$(jq -r .tarball <<<"$packed")"
          } >> "$GITHUB_OUTPUT"
          {
            echo "## Republish tarball"
            echo "\`$(jq -r '.name + "@" + .version' <<<"$packed")\` sha256 \`$(jq -r .sha256 <<<"$packed")\`"
            echo '```'
            tar -tzf "$(jq -r .tarball <<<"$packed")"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Refuse a tarball for another package
        env:
          PACKED_NAME: ${{ steps.pack.outputs.name }}
        run: test "$PACKED_NAME" = "$PACKAGE"

      - name: Confirm environment variables
        run: |
          if [ -n "${{ secrets.NPM_TOKEN }}" ]; then
            echo "NPM_TOKEN is set"
          else
            echo "NPM_TOKEN is not set"
            exit 1
          fi

      - name: Publish to NPM (dry run)
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish "$TARBALL" --dry-run --provenance --access public

      # Publishes the tarball checked above, not a fresh pack.
      - name: Publish the checked tarball to NPM
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
        run: |
          echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > ~/.npmrc
          npm publish "$TARBALL" --provenance --access public

      - name: Push release tag
        env:
          TAG: ${{ steps.pack.outputs.name }}@${{ steps.pack.outputs.version }}
        run: |
          git tag "$TAG"
          git push origin "refs/tags/$TAG"
